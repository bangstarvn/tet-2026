<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Countdown Tết Bính Ngọ 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800&display=swap');
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Be Vietnam Pro',sans-serif;
    color:#fff;
    overflow:hidden;
    background: #000; /* Fallback nếu video lỗi */
}

/* VIDEO BACKGROUND */
.video-bg{position:fixed;inset:0;z-index:-2}
.video-bg video{width:100%;height:100%;object-fit:cover}

/* OVERLAY LÀM TỐI VIDEO */
.overlay{
    position:fixed;inset:0;
    background:radial-gradient(circle at center,rgba(0,0,0,.3),rgba(0,0,0,.8));
    z-index:-1;
}

/* CANVAS PHÁO HOA */
#fireworks{
    position:fixed;inset:0;
    z-index:2;
    pointer-events:none;
}

/* LỜI CHÚC TRUNG TÂM */
#greeting{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;
    text-align:center;
    width: 100%;
    z-index:3;
    pointer-events:none;
    transition:all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Hiệu ứng nảy */
}
#greeting h2 {
    font-size: 3.5em; /* Tăng kích thước */
    margin: 0;
    color: #ffcc00; /* Vàng kim đậm */
    text-shadow: 0 0 10px #ffcc00, 0 0 20px red;
    line-height: 1.2;
}
#greeting span{
    display:block;
    margin-top:20px;
    font-size:1.5rem;
    color:#fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 2px;
}
#greeting.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* HIỆU ỨNG CHỮ NỔ (EXPLODE TEXT) */
#letters{position:fixed;inset:0;z-index:4;pointer-events:none}
.letter{
    position:absolute;
    left:50%;top:50%;
    font-size:2.5em;
    font-weight:800;
    color:gold;
    opacity:0;
    transform:translate(-50%,-50%) scale(0);
    text-shadow:0 0 15px gold;
    /* QUAN TRỌNG: Transition để chữ bay mượt */
    transition: transform 1s ease-out, opacity 1s ease-out;
    white-space: nowrap;
}

/* CONTAINER CHÍNH */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition: opacity 1s ease;
}
.container.fade-out {
    opacity: 0;
    pointer-events: none;
}

h1{
    font-size:3.5em;
    color:#ffcc00;
    text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
    margin-bottom: 10px;
}
.subtitle{
    font-size: 1.2em;
    margin-bottom:40px;
    font-weight: 300;
    opacity: 0.9;
}

/* ĐỒNG HỒ ĐẾM NGƯỢC */
.countdown{display:flex;gap:20px;flex-wrap:wrap;justify-content: center;}
.box{
    min-width:130px;
    padding:25px 15px;
    border:1px solid rgba(255, 215, 0, 0.3);
    border-radius:15px;
    background:rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.number{
    font-size:3em;
    font-weight: 700;
    color: #fff;
    display: block;
    margin-bottom: 5px;
}
.label {
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ffcc00;
}

@media(max-width:600px){
    h1{font-size:2em}
    .box{min-width:80px; padding: 15px 10px;}
    .number{font-size: 2em;}
    #greeting h2{font-size:2em}
}
/* ===== ORBIT + FALL EFFECT ===== */
.letter.orbit {
    animation: orbit 3s linear forwards;
}

@keyframes orbit {
    from {
        transform:
            translate(var(--x), var(--y))
            rotate(0deg)
            scale(1.4);
    }
    to {
        transform:
            translate(var(--x), var(--y))
            rotate(360deg)
            scale(1.4);
    }
}

.letter.fall {
    transition: transform 2.5s ease-in, opacity 2.5s ease-in;
    opacity: 0;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>
<div id="letters"></div>

<div id="greeting">
    <h2>CHÚC MỪNG<br>NĂM MỚI 2026</h2>
    <span>BÍNH NGỌ ĐẠI CÁT</span>
</div>

<div class="video-bg">
    <video autoplay muted loop playsinline>
        <source src="https://videos.pexels.com/video-files/3191929/3191929-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>
</div>
<div class="overlay"></div>

<div class="container" id="mainContainer">
    <div id="intro">
        <h1>🎇 Countdown 2026 🎇</h1>
        <div class="subtitle">Sắp đến khoảnh khắc Giao Thừa...</div>
    </div>

    <div class="countdown" id="countdown">
        <div class="box">
            <span class="number" id="days">00</span>
            <span class="label">Ngày</span>
        </div>
        <div class="box">
            <span class="number" id="hours">00</span>
            <span class="label">Giờ</span>
        </div>
        <div class="box">
            <span class="number" id="minutes">00</span>
            <span class="label">Phút</span>
        </div>
        <div class="box">
            <span class="number" id="seconds">00</span>
            <span class="label">Giây</span>
        </div>
    </div>
</div>

<script>
/* ==== CẤU HÌNH THỜI GIAN ==== */
// Mùng 1 Tết Bính Ngọ 2026 là ngày 17/02/2026 Dương Lịch
//const targetDate = new Date("February 17, 2026 00:00:00").getTime();

// *** CHẾ ĐỘ TEST (Bỏ comment dòng dưới để test chạy thử 5 giây) ***
 const targetDate = Date.now() + 5000; 

/* ==== DOM ELEMENTS ==== */
const elDays = document.getElementById("days");
const elHours = document.getElementById("hours");
const elMinutes = document.getElementById("minutes");
const elSeconds = document.getElementById("seconds");
const mainContainer = document.getElementById("mainContainer");

/* ==== LOGIC ĐẾM NGƯỢC ==== */
const timer = setInterval(() => {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
        clearInterval(timer);
        // Set về 0 hết
        elDays.innerText = "00";
        elHours.innerText = "00";
        elMinutes.innerText = "00";
        elSeconds.innerText = "00";
        
        startCelebration(); // Bắt đầu ăn mừng
        return;
    }

    // Tính toán thời gian
    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((distance % (1000 * 60)) / 1000);

    // Cập nhật giao diện (thêm số 0 đằng trước nếu < 10)
    elDays.innerText = d < 10 ? "0" + d : d;
    elHours.innerText = h < 10 ? "0" + h : h;
    elMinutes.innerText = m < 10 ? "0" + m : m;
    elSeconds.innerText = s < 10 ? "0" + s : s;

}, 1000);

/* ==== LOGIC PHÁO HOA ==== */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

// Resize canvas full màn hình
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function createFirework(x, y) {
    const particleCount = 100;
    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        // Tốc độ ngẫu nhiên để tạo hình cầu
        const velocity = Math.random() * 6; 
        
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life: 100 + Math.random() * 50, // Thời gian sống
            alpha: 1,
            color: `hsl(${Math.random() * 360}, 100%, 60%)`,
            gravity: 0.05 // Thêm trọng lực
        });
    }
}

function animateFireworks() {
    // Tạo hiệu ứng đuôi mờ (trail effect)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; // Độ mờ của đuôi
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.globalCompositeOperation = 'lighter';

    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity; // Áp dụng trọng lực rơi xuống
        p.life--;
        p.alpha -= 0.01;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();

        if (p.life <= 0 || p.alpha <= 0) particles.splice(i, 1);
    });
    
    requestAnimationFrame(animateFireworks);
}
animateFireworks();

/* ==== KỊCH BẢN CHÚC MỪNG ==== */
function startCelebration() {
    // 1. Ẩn đồng hồ đi
    mainContainer.classList.add("fade-out");
    setTimeout(() => { mainContainer.style.display = "none"; }, 1000);

    // 2. Hiện lời chúc chính
    setTimeout(() => {
        document.getElementById("greeting").classList.add("show");
    }, 500);

    // 3. Bắn pháo hoa liên tục
    let fwInterval = setInterval(() => {
        createFirework(
            Math.random() * canvas.width, 
            Math.random() * canvas.height * 0.6 // Chỉ bắn ở 60% phía trên
        );
    }, 400); // Bắn dày hơn

    // 4. Hiệu ứng chữ nổ xung quanh (Explosion Text)
    setTimeout(() => explodeText(), 1500);

    // Dừng bắn pháo hoa sau 15 giây để đỡ lag máy
    setTimeout(() => clearInterval(fwInterval), 15000);
}

/* ==== LOGIC CHỮ NỔ ==== */
function explodeText() {
    const textString = "HAPPY NEW YEAR 2026";
    const box = document.getElementById("letters");
    box.innerHTML = "";

    const chars = [...textString].filter(c => c !== " ");
    const total = chars.length;

    const baseRadius = 260;
    const angleOffset = -Math.PI / 2;

    chars.forEach((char, index) => {
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = char;

        const angle = (index / total) * Math.PI * 2 + angleOffset;
        const radius = baseRadius;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        span.style.setProperty("--x", `${x}px`);
        span.style.setProperty("--y", `${y}px`);

        span.style.color = `hsl(${40 + Math.random() * 20},100%,65%)`;

        box.appendChild(span);

        // Bật hiển thị + đặt vị trí
        setTimeout(() => {
            span.style.opacity = 1;
            span.style.transform = `translate(${x}px, ${y}px) scale(1.4)`;
            span.classList.add("orbit");
        }, index * 60);

        // Sau khi quay xong → rơi xuống
        setTimeout(() => {
            const fallY = y + 400 + Math.random() * 200;
            span.classList.remove("orbit");
            span.classList.add("fall");
            span.style.transform =
                `translate(${x + (Math.random()*100-50)}px, ${fallY}px) scale(0.8) rotate(${Math.random()*90-45}deg)`;
        }, 3200);
    });

    // Cleanup DOM
    setTimeout(() => {
        box.innerHTML = "";
    }, 6500);
}

</script>
</body>
</html>
